# spatial_current_semantics_v1 -- the registered inputs of the current-observation
# 3D landing task. Every key is required and unknown keys are refused:
# current_semantics.contracts.load_config has no silent defaults.
schema_id: spatial_current_semantics_v1
# The camera K, mount and R_CB are rebuilt from this resolved profile; its stale
# vertical_fov_deg (70) is never read -- VFOV is derived from K (73.74 deg).
deployment_profile: spatial-reference/12
camera:
  # Optical depth at or below which the projection is neutral (front_valid 0).
  z_near_m: 0.05
feature_scales:
  approach_position_m: 1.0
  approach_velocity_m_s: 1.0
  approach_closure_m2_s: 1.0
  image_coordinate: 1.0
  image_rate_per_s: 1.0
contact:
  # Circular pad and the spatial/safety.py settled limits.
  pad_radius_m: 0.5
  xy_speed_m_s: 0.35
  z_speed_m_s: 0.30
  tilt_deg: 5.0
  rate_deg_s: 10.0
  status: provisional-until-G2
action:
  frame: world_enu
  maximum_m_s2: [2.5, 2.5, 2.0]
  # The spatial-reference command limit (20 deg command / 21 deg hard envelope)
  # of the adapter every arm's action passes through (ActionContract.adapter).
  adapter_max_tilt_deg: 20.0
model:
  node_embedding: 8
  hops: 2
  readout: LandingContext
  initial_log_std: -1.0
  # Widths matched to a common parameter budget: 4022 / 4008 / 4020 / 4016 parameters.
  heads:
    raw_ppo: 110
    semantic_mlp_ppo: 57
    untyped_gnn_ppo: 74
    ontology_rgat_ppo: 66
  critic_hidden: 55
experiment_proposal:
  registered: false
  note: guide section 11 numbers are a proposal, not a registration
# Implementation-check (G3) seeds: load_config refuses any seed inside
# contracts.AUDITED_SEED_RANGES. Hashed as g3_hash, never into algorithm_hash.
g3_pilot_seeds: [990001, 990002, 990003, 990004, 990005, 990006, 990007, 990008]
# Local actuation/vision coupling probes (G3), flown from the nominal
# spatial-reference/12 reset hover at 2.0-2.5 m body height.
g3_local:
  axis_coupling:
    # 40 % of the 2.5 m/s^2 lateral maximum: a 5.8 deg tilt, far inside the
    # 20 deg adapter limit. The 0.5 s push outlasts the 0.1 s actuation delay
    # plus the ~0.4 s servo settling; the 0.5 s zero-command coast lets the
    # attitude return so the image offset is translation.
    acceleration_m_s2: 1.0
    push_steps: 5
    coast_steps: 5
    cross_axis_ratio_max: 0.2
    superposition_residual_max: 0.2
  fov_exit:
    # A walking-pace drift of the pad across ONE frame edge at constant height;
    # the cross axis holds the pad centred (zeta 0.71) so it cannot leave
    # through a corner while the pad accelerates.
    exit_speed_m_s: 0.6
    velocity_gain_per_s: 2.0
    cross_position_gain_per_s2: 2.0
    height_gain_per_s2: 2.0
    acceleration_limit_m_s2: 1.5
    max_steps: 100
    steps_after_loss: 10
    # Two 20 Hz frame spacings at the exit speed plus the 0.02 m optical noise.
    overshoot_tolerance_m: 0.1
  low_altitude_blind_zone:
    # 0.25 m/s sink, inside the 0.30 m/s touchdown limit. Lateral PD at
    # omega 1.7 rad/s, zeta 0.87: below the ~3 rad/s the 0.1 s actuation delay
    # plus servo lag allows, stiff enough to centre within ~0.2 m against the
    # seeded external force.
    position_gain_per_s2: 3.0
    velocity_gain_per_s: 3.0
    sink_speed_m_s: 0.25
    height_gain_per_s2: 2.0
    vertical_velocity_gain_per_s: 3.0
    acceleration_limit_m_s2: 1.5
    max_steps: 300
  quality_channels:
    age_tolerance_s: 1.0e-9
# The Isaac half of G3: the same probe flights through the owned Isaac/PX4 stack.
g3_isaac:
  seeds: [990001, 990002]
  # Floor on corr(sin pitch, +a_x) and -corr(sin roll, +a_y); Isaac flights
  # measured 0.686 and 0.966.
  axis_sign_min_abs_correlation: 0.5
# The common task of every arm. The VERDICT and the terminal table are the
# spatial-reference/12 Evaluator's (SUCCESS 25 / TASK_TIMEOUT -12 / unsafe -40,
# impact-speed contact verdict, 21 deg / 20 m / 60 m envelope), scored on the actual
# transition time, with no supervisor (SAFE_ABORT unreachable). Only the dense part
# is replaced (current_semantics/reward.py): Phi(s') - Phi(s) of a velocity-field
# potential, Phi kept at the terminal, plus a time and a control cost. The potential
# orders a field-following controller (+17.1) above hover (-28.2), dive (-38.5) and
# random (-113), and a memoryless controller following the field from the 21-D
# estimate alone lands 24/24 at d = 0 and 20/24 at nominal difficulty.
task:
  evaluator: spatial.environment.Evaluator
  supervisor: none
  unsafe_penalty: nominal
  # A = the pad's bearing from the drone at reset and B = the pad's travel heading,
  # both drawn over the full circle in `bins` sectors (centred on 0, 90, 180,
  # 270 deg). Training, validation and in-distribution tests use the 12 combinations
  # not held out; the composition test uses only the 4 held-out [bearing bin,
  # heading bin]. The held-out set holds out every A and every B bin once and is not
  # a cyclic shift: relative classes (B - A) of 0, 1, 1, 2 sectors, so every class
  # keeps trained combinations.
  scenario:
    version: spatial-current-scenario/1
    bins: 4
    offset_radius_m: [0.3, 0.9]
    held_out: [[0, 0], [1, 2], [2, 3], [3, 1]]
  reward:
    version: spatial-current-reward/4
    distance_weight_per_m: 2.0
    velocity_weight_per_m_s: 4.0
    time_cost_per_s: 0.3
    control_cost_per_s: 0.5
    # Per second on the true tilt above the onset, quadratic up to 21 deg. There is
    # no command-change cost: charged on the sampled action, exploration noise alone
    # would pay it (0.65 per decision at the initial sigma, 22x the time cost).
    tilt_cost_per_s: 20.0
    tilt_cost_onset_deg: 10.0
    field:
      lateral_gain_per_s: 1.0
      lateral_speed_max_m_s: 1.5
      descent_gain_per_s: 0.5
      descent_speed_max_m_s: 0.8
      # Inside the 0.30 m/s touchdown limit; the field ends in an accepted contact.
      touchdown_sink_m_s: 0.2
      # Descent is asked for only within r_0 + k_r * h of the pad centre (r_0 < pad).
      alignment_radius_m: 0.25
      alignment_radius_per_m: 0.5
      # Once the policy's own vision age passes after_s (fully at full_after_s),
      # v_des_z turns from the sink to a climb toward search_height_m above the
      # contact height -- except in the blind last stretch of a landing (below
      # terminal_height_m AND within terminal_radius_m of the pad centre, edges
      # ramped over ramp_m). Local landings lose the pad below about 0.43 m within
      # 0.56 m of the centre, which this exemption covers.
      lost_view:
        after_s: 0.5
        full_after_s: 1.0
        climb_speed_m_s: 0.5
        climb_gain_per_s: 1.0
        search_height_m: 2.5
        terminal_height_m: 0.5
        terminal_radius_m: 0.75
        ramp_m: 0.25
# The training plant: spatial-reference/12 LocalBackend with Isaac-measured calibrations.
local_plant:
  # Median body height of 78 legless Isaac first contacts (0.0636-0.0732 m); the
  # /12 profile's 0.12 m would end local episodes ~0.05 m early.
  contact_height_m: 0.0672
  # Isaac hands over only once an optical solve exists; the local reset waits for it.
  handover_wait_max_s: 1.0
  # Identity (every 20 Hz frame kept, no extra drops). Thinning local frames to
  # ~10.6 Hz made the reference ABG track lock out on 11/16 local episodes
  # (estimate-vs-fresh-optical gap p99 3.6 m, against 0.12 m at 20 Hz and 0.20 m in
  # Isaac), and the Isaac observer's 21-D flag and age already match local 20 Hz
  # (updated in view 0.988 vs 0.977, median age at update 0.100 s in both).
  optical_cadence:
    keep_every_nth_capture: 1
    extra_drop_probability: 0.0
# The training recipe shared by every arm; the study plans (learning_speed_v1,
# equal_budget_v1) reuse it with their own arms, seeds and budgets. PPO uses
# complete-episode batches of 12, a post-step KL guard and GAE on the actual
# transition time. The curriculum is training-only; validation and test always
# run at difficulty 1.0 and only checkpoints at 1.0 are selectable. As the G4
# learnability check (Raw arm), it is judged on held-out test seeds with BOTH the
# deterministic and the sampled policy (a mean that lands while samples never
# do fails).
g4_pilot:
  protocol: g4-pilot/7
  arm: raw_ppo
  model_seeds: [0, 1]
  updates: 600
  episodes_per_update: 12
  # Promote by 0.1 once the sampled training success over the last 5 updates
  # (60 episodes) at the current difficulty reaches 50 %; never demote.
  curriculum:
    start_difficulty: 0.0
    step: 0.1
    window_updates: 5
    promote_at_success: 0.5
  validate_every: 10
  validation_seeds: [992001, 992002, 992003, 992004, 992005, 992006, 992007, 992008,
                     992009, 992010, 992011, 992012, 992013, 992014, 992015, 992016,
                     992017, 992018, 992019, 992020, 992021, 992022, 992023, 992024]
  test_seeds: [993001, 993002, 993003, 993004, 993005, 993006, 993007, 993008,
               993009, 993010, 993011, 993012, 993013, 993014, 993015, 993016,
               993017, 993018, 993019, 993020, 993021, 993022, 993023, 993024,
               993025, 993026, 993027, 993028, 993029, 993030, 993031, 993032,
               993033, 993034, 993035, 993036, 993037, 993038, 993039, 993040,
               993041, 993042, 993043, 993044, 993045, 993046, 993047, 993048]
  # Training episode seed = base + model_seed * 1e6 + update * episodes + episode.
  train_seed_base: 3000000
  workers: 16
  ppo:
    epochs: 8
    minibatch: 256
    clip: 0.2
    gae_lambda: 0.95
    policy_lr: 3.0e-4
    value_lr: 1.0e-3
    entropy_coefficient: 0.0
    max_grad_norm: 1.0
    # Post-step KL guard: a step above 1.5 * target_kl is reverted.
    target_kl: 0.02
  criteria:
    deterministic_success_min: 0.5
    sampled_success_min: 0.25
  # Training episodes only. The own velocity the observer receives carries
  # e0 exp(-t/tau) after reset, the own position its integral (the Isaac EKF error
  # after the handover kick: +-0.6 m/s between decisions).
  training_randomization:
    handover_own_state_error:
      horizontal_max_m_s: 1.5
      vertical_max_m_s: 0.4
      tau_min_s: 0.15
      tau_max_s: 0.5
    # In half the training episodes no optical frame reaches the observer for
    # 1-3 s starting 0.5-4 s after handover, so the policy meets the lost-view
    # state the reward field prices. Without it, trained policies lost the pad at
    # altitude in 0-5 of 48 local episodes (<= 2 % of decisions), too rare to
    # learn from.
    vision_blackout:
      probability: 0.5
      start_min_s: 0.5
      start_max_s: 4.0
      duration_min_s: 1.0
      duration_max_s: 3.0
# Deterministic Isaac/PX4 check of the selected checkpoints on an owned stack,
# resumable after an infrastructure failsafe. Its seeds are reserved: the study
# plans refuse to reuse them.
isaac_eval:
  protocol: isaac-eval/5
  seeds: [994041, 994042, 994043, 994044, 994045, 994046, 994047, 994048, 994049, 994050]
  deterministic_success_min: 0.5
